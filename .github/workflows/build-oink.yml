name: build-oink

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-oink.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成工程
        working-directory: app
        run: |
          xcodegen generate
          ls -la
          xcodebuild -list -project Oink.xcodeproj

      - name: 编译（未签名）
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project Oink.xcodeproj \
            -scheme Oink \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Oink.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: 打包 IPA
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          APP="$(find Oink.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)"
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 全能签只认根目录为 Payload/ 的 zip
          zip -qry Oink.ipa Payload
          unzip -l Oink.ipa | head -25
          # 确认主二进制是未签名的
          xcrun codesign -dv Oink.xcarchive/Products/Applications/*.app 2>&1 | head -5 || true

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: oink-unsigned-ipa
          path: ${{ runner.temp }}/Oink.ipa
          if-no-files-found: error
          retention-days: 30
