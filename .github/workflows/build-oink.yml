name: build-oink

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-oink.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 閫夋嫨 Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 瀹夎 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 鐢熸垚宸ョ▼
        working-directory: app
        run: |
          xcodegen generate
          ls -la
          xcodebuild -list -project Aishijie.xcodeproj

      - name: 缂栬瘧锛堟湭绛惧悕锛?        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project Aishijie.xcodeproj \
            -scheme Aishijie \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Aishijie.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: 鎵撳寘 IPA
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          APP="$(find Aishijie.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)"
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 鍏ㄨ兘绛惧彧璁ゆ牴鐩綍涓?Payload/ 鐨?zip
          zip -qry Aishijie.ipa Payload
          unzip -l Aishijie.ipa | head -25
          # 纭涓讳簩杩涘埗鏄湭绛惧悕鐨?          xcrun codesign -dv Aishijie.xcarchive/Products/Applications/*.app 2>&1 | head -5 || true

      - name: 涓婁紶
        uses: actions/upload-artifact@v4
        with:
          name: oink-unsigned-ipa
          path: ${{ runner.temp }}/Aishijie.ipa
          if-no-files-found: error
          retention-days: 30
