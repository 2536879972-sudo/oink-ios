name: build-ios

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-oink.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate project
        working-directory: app
        run: |
          xcodegen generate
          ls -la
          xcodebuild -list -project Aishijie.xcodeproj

      - name: Build unsigned archive
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project Aishijie.xcodeproj \
            -scheme Aishijie \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Aishijie.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          APP="$(find Aishijie.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)"
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Aishijie.ipa Payload
          unzip -l Aishijie.ipa | head -25

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: aishijie-unsigned-ipa
          path: ${{ runner.temp }}/Aishijie.ipa
          if-no-files-found: error
          retention-days: 30
