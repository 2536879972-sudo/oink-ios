name: build-ios-artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      project:
        description: "工程名（.xcodeproj / .xcworkspace / Package.swift 所在目录名）"
        required: true
        default: "MyApp"
      scheme:
        description: "Scheme 名"
        required: true
        default: "MyApp"
      dylib_repo:
        description: "可选：同时编译 Theos dylib（填 hook 目录相对路径，留空跳过）"
        required: false
        default: ""

jobs:
  build-app:
    runs-on: macos-14
    outputs:
      ipa: ${{ steps.pkg.outputs.ipa }}
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: 打印环境
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 编译（未签名）
        env:
          PROJ: ${{ github.event.inputs.project || 'MyApp' }}
          SCHEME: ${{ github.event.inputs.scheme || 'MyApp' }}
        run: |
          set -euo pipefail
          BUILD_ARGS=""
          if [ -d "$PROJ.xcworkspace" ]; then
            BUILD_ARGS="-workspace $PROJ.xcworkspace"
          elif [ -d "$PROJ.xcodeproj" ]; then
            BUILD_ARGS="-project $PROJ.xcodeproj"
          else
            echo "未找到工程，尝试 Swift Package"; ls -la; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/out"
          xcodebuild $BUILD_ARGS \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -archivePath "$RUNNER_TEMP/out/app.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty || xcodebuild $BUILD_ARGS -scheme "$SCHEME" -sdk iphoneos \
                -configuration Release archive \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER=""

      - name: 打包成未签名 IPA
        id: pkg
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          APP=$(find app.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 确保根目录就是 Payload/，全能签只认这个结构
          zip -qry unsigned.ipa Payload
          unzip -l unsigned.ipa | head -20
          echo "ipa=$RUNNER_TEMP/out/unsigned.ipa" >> "$GITHUB_OUTPUT"

      - name: 上传未签名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/out/unsigned.ipa
          if-no-files-found: error

  build-dylib:
    runs-on: macos-14
    if: ${{ github.event.inputs.dylib_repo != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Theos
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar xz -C /tmp
          mv /tmp/sdks-master/iPhoneOS*.sdk "$THEOS/sdks/" 2>/dev/null || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: 编译 dylib
        working-directory: ${{ github.event.inputs.dylib_repo }}
        run: |
          set -euo pipefail
          make clean || true
          make -f Makefile.dylib FINALPACKAGE=1
          find .theos -name "*.dylib" -exec ls -la {} \;

      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: hook-dylib
          path: ${{ github.event.inputs.dylib_repo }}/.theos/**/*.dylib
          if-no-files-found: warn
