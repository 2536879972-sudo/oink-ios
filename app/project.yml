name: Aishijie
options:
  bundleIdPrefix: com.operator
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  Aishijie:
    type: application
    platform: iOS

    sources:
      - path: Sources
      - path: Resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.operator.oink
        PRODUCT_NAME: Aishijie
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # CI 上没有证书，必须显式关签名才能出未签名产物
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 哀世界
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: 拍照发送图片给 AI
        NSPhotoLibraryUsageDescription: 选择相册图片发送给 AI
        NSMicrophoneUsageDescription: 语音输入需要麦克风
        NSSpeechRecognitionUsageDescription: 把语音转成文字发送
